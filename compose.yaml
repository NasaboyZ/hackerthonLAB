services:
  postgres:
    image: postgis/postgis:17-3.5
    platform: linux/amd64
    container_name: magnetrail-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magnetrail}
      POSTGRES_USER: ${POSTGRES_USER:-magnetrail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-magnetrail_dev_only}
    ports:
      - "5432:5432"
    volumes:
      - magnetrail-postgres-data:/var/lib/postgresql/data
      - ./infra/docker/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  magnetrail-postgres-data:

